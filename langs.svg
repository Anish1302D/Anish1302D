<svg xmlns="http://www.w3.org/2000/svg" width="350" height="280" viewBox="0 0 350 280" fill="none">
  <defs>
    <linearGradient id="lgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <clipPath id="lgClip"><rect width="350" height="280" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#lgClip)">
    <rect width="350" height="280" fill="url(#lgGrad)" rx="12"/>
    <rect width="350" height="280" rx="12" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3" fill="none"/>

    <text x="25" y="33" font-family="'Segoe UI',Ubuntu,sans-serif" font-weight="700" font-size="14" fill="#3b82f6" opacity="0">
      🔤 Most Used Languages
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze"/>
    </text>

    <!-- JavaScript -->
    <g transform="translate(25,55)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
      <text x="0" y="12" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="11.5" fill="#e5e7eb">JavaScript</text>
      <text x="300" y="12" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">28%</text>
      <rect x="0" y="18" width="300" height="8" rx="3" fill="#1e293b" fill-opacity="0.3"/>
      <rect x="0" y="18" width="0" height="8" rx="3" fill="#f1e05a">
        <animate attributeName="width" from="0" to="84" dur="1s" begin="0.3s" fill="freeze"/>
      </rect>
    </g>

    <!-- TypeScript -->
    <g transform="translate(25,90)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
      <text x="0" y="12" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="11.5" fill="#e5e7eb">TypeScript</text>
      <text x="300" y="12" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">22%</text>
      <rect x="0" y="18" width="300" height="8" rx="3" fill="#1e293b" fill-opacity="0.3"/>
      <rect x="0" y="18" width="0" height="8" rx="3" fill="#3178c6">
        <animate attributeName="width" from="0" to="66" dur="1s" begin="0.5s" fill="freeze"/>
      </rect>
    </g>

    <!-- Python -->
    <g transform="translate(25,125)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.7s" fill="freeze"/>
      <text x="0" y="12" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="11.5" fill="#e5e7eb">Python</text>
      <text x="300" y="12" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">20%</text>
      <rect x="0" y="18" width="300" height="8" rx="3" fill="#1e293b" fill-opacity="0.3"/>
      <rect x="0" y="18" width="0" height="8" rx="3" fill="#3572A5">
        <animate attributeName="width" from="0" to="60" dur="1s" begin="0.7s" fill="freeze"/>
      </rect>
    </g>

    <!-- HTML/CSS -->
    <g transform="translate(25,160)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
      <text x="0" y="12" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="11.5" fill="#e5e7eb">HTML / CSS</text>
      <text x="300" y="12" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">15%</text>
      <rect x="0" y="18" width="300" height="8" rx="3" fill="#1e293b" fill-opacity="0.3"/>
      <rect x="0" y="18" width="0" height="8" rx="3" fill="#e34c26">
        <animate attributeName="width" from="0" to="45" dur="1s" begin="0.9s" fill="freeze"/>
      </rect>
    </g>

    <!-- Jupyter -->
    <g transform="translate(25,195)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
      <text x="0" y="12" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="11.5" fill="#e5e7eb">Jupyter Notebook</text>
      <text x="300" y="12" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">8%</text>
      <rect x="0" y="18" width="300" height="8" rx="3" fill="#1e293b" fill-opacity="0.3"/>
      <rect x="0" y="18" width="0" height="8" rx="3" fill="#DA5B0B">
        <animate attributeName="width" from="0" to="24" dur="1s" begin="1.1s" fill="freeze"/>
      </rect>
    </g>

    <!-- C -->
    <g transform="translate(25,230)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.3s" fill="freeze"/>
      <text x="0" y="12" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="11.5" fill="#e5e7eb">C</text>
      <text x="300" y="12" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">5%</text>
      <rect x="0" y="18" width="300" height="8" rx="3" fill="#1e293b" fill-opacity="0.3"/>
      <rect x="0" y="18" width="0" height="8" rx="3" fill="#555555">
        <animate attributeName="width" from="0" to="15" dur="1s" begin="1.3s" fill="freeze"/>
      </rect>
    </g>

    <text x="25" y="272" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="10" fill="#6b7280" opacity="0">
      Based on public repository analysis
      <animate attributeName="opacity" from="0" to="0.6" dur="0.4s" begin="1.5s" fill="freeze"/>
    </text>

    <circle cx="330" cy="20" r="2" fill="#3b82f6">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
